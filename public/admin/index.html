<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mashariki Life — Admin</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<div id="login-screen" class="login-screen">
  <form id="login-form" class="login-card">
    <h1>Mashariki Life</h1>
    <p class="muted">Admin dashboard</p>
    <label>Username</label>
    <input type="text" id="login-username" autocomplete="username" required />
    <label>Password</label>
    <input type="password" id="login-password" autocomplete="current-password" required />
    <button type="submit">Sign in</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">Mashariki Life<span>Admin</span></div>
    <nav id="nav"></nav>
    <button id="logout-btn" class="logout">Log out</button>
  </aside>
  <main class="main">
    <header class="topbar">
      <h2 id="page-title">Dashboard</h2>
      <span id="whoami" class="muted"></span>
    </header>
    <section id="content" class="content"></section>
  </main>
</div>

<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal">
    <h3 id="modal-title">Edit</h3>
    <form id="modal-form"></form>
    <div class="modal-actions">
      <button id="modal-cancel" class="secondary" type="button">Cancel</button>
      <button id="modal-save" type="submit" form="modal-form">Save</button>
    </div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
